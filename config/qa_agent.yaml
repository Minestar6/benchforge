# qa_agent 配置
# 对应 benchforge/agents/qa_agent/ 的 Mode-Staged Generation Agent

# task_id / run_id 由调用方（CLI 或编排器）传入，不在 YAML 中配置
# 下游 agent 从 shared_state.json 获取全部运行上下文

# ── 模型（引用 model_registry.yaml 中的逻辑名） ────────────────────────────────
model:
  name: deepseek-v4             # model_registry.yaml 中的 key
  # 调用参数在 agent 级别指定，不在 registry 中
  temperature: 0.2
  max_tokens: 4096
  max_retries: 2

# ── Wikipedia 检索 ────────────────────────────────────────────────────────────
retrieval:
  request_timeout: 10
  # Saliency 重排：按 Wikimedia 访问量保留最显著的页面（参考 AutoBencher saliency_rerank）
  # saliency_top_k 同时作为最终页面数；开启时内部自动搜索 top_k×2 个候选再筛选
  saliency_rerank: true
  saliency_top_k: 5
  saliency_start_date: "2022010100"
  saliency_end_date: "2025010100"
  # 内容提取：段落最小词数（短段落被过滤，同 wiki.py min_token）
  min_paragraph_tokens: 20

# ── 分块（题目生成用） ─────────────────────────────────────────────────────────
chunking:
  chunk_size: 1024
  overlap: 50
  encoding: "cl100k_base"

# ── 分块（文档总结用） ─────────────────────────────────────────────────────────
summarization_chunking:
  chunk_size: 4096              # 大块减少 LLM 调用次数
  overlap: 125
  encoding: "cl100k_base"

# blueprint（topics/modes/language）在 config/blueprint.yaml 中定义
# 这是任务级配置，所有智能体共享，qa_agent 加载后写入 shared_state.json

# ── Multi-Chunk 组合生成 ─────────────────────────────────────────────────────
multi_chunk:
  h_min: 2
  h_max: 4
  multi_ratio: 1.0              # multi_units 目标数量 = ceil(single_units × 此值)
  max_units_per_topic: 300
  max_units_per_expansion: 300

# ── 候选池 ────────────────────────────────────────────────────────────────────
candidate_pool:
  min_candidate_multiplier: 1.2  # 每个难度达到的最小候选倍率
  max_candidate_multiplier: 2.0  # 总候选数硬上限，避免过生成

# ── 初始广度轮 ────────────────────────────────────────────────────────────────
initial_breadth:
  enabled: true
  max_topics_per_round: 4     # 单轮最多覆盖的主题数
  difficulty: "medium"         # 初始广度轮固定使用 medium 难度
  difficulty_policy: "hard_aware"
  hard_ratio_threshold: 0.3

# ── 自适应补题规划 ────────────────────────────────────────────────────────────
planner:
  topics_per_round: 3          # 自适应轮每轮选几个主题

# ── Chunk 混合比例（按难度） ───────────────────────────────────────────────────
# single_ratio + multi_ratio = 1.0
# mode_adjustment.single_delta 在基础比例上叠加偏移
chunk_mix:
  by_difficulty:
    easy:
      single_ratio: 0.7        # easy 题以单 chunk 为主
      multi_ratio: 0.3
    medium:
      single_ratio: 0.5
      multi_ratio: 0.5
    hard:
      single_ratio: 0.1      # hard 题以多 chunk 为主（需要跨段推理）
      multi_ratio: 0.9

  mode_adjustment:
    qa:
      single_delta: 0.1        # QA 偏向单 chunk（答案定位明确）
    multiple_choice:
      single_delta: -0.1       # MCQ 偏向多 chunk（干扰项需要对比）

# ── 每 chunk 平均生成题目数（用于反推 single_k / multi_k） ─────────────────────
generation_yield:
  qa:
    single_chunk_avg_questions: 3.0
    multi_chunk_avg_questions: 4.0
  multiple_choice:
    single_chunk_avg_questions: 2.0
    multi_chunk_avg_questions: 3.0

# ── single_k / multi_k 上下界（防止单轮采样过多或过少） ───────────────────────
chunk_limits:
  qa:
    single_k:
      min: 1
      max: 4
    multi_k:
      min: 0
      max: 3
  multiple_choice:
    single_k:
      min: 0
      max: 3
    multi_k:
      min: 1
      max: 4

# ── 运行时安全阈值 ────────────────────────────────────────────────────────────
runtime:
  max_consecutive_empty_rounds_per_mode: 3   # 连续空轮超过此值停止当前 mode
  max_failures_per_mode: 3                   # 单 mode 累计失败次数上限
  max_used_chunk_combinations: 10000         # 全局 chunk 组合去重池上限
  llm_timeout_seconds: 60
  retrieval_timeout_seconds: 30

# ── 日志 ──────────────────────────────────────────────────────────────────────
logging:
  level: "INFO"
  # log_file 未被 config_loader 读取，run_id 在运行时动态生成，此处仅供参考
  # log_file: "./logs/run_{YYYYMMDD}_{HHMMSS}_{4hex}.log"

experiment:
  name: full
  enable_feedback: true
  enable_hard_generate: true
  enable_difficulty_adaptation: true
  enable_terminal_hard_repair: true
  terminal_hard_repair_min_missing: 2
  terminal_hard_repair_gap_threshold: 0.15
  terminal_hard_repair_topics: 2
  terminal_hard_repair_multi_k_scale: 1.0
  fixed_strategy: null
  fixed_difficulty: null
  disable_initial_breadth: false
