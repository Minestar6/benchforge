citation_validation:
  enabled: true
  min_chunk_citation_score: 0.60
  min_answer_citation_score: 0.55
  alpha: 0.3
  beta: 0.7
  citation_match_threshold: 0.60

llm_validation:
  enabled: false
  model: deepseek-v4       # model_registry.yaml 中的 key（逻辑名）
  temperature: 0.0                # 调用参数（不在 registry 中）
  max_tokens: 1500
  min_overall_score: 0.75
  max_concurrency: 2
  max_retries: 2
  prompt_path: "benchforge/prompts/verify_agent/quality_prompt.md"

selection:
  mode: "light"
  embedding_model: "all-MiniLM-L6-v2"
  semantic_similarity_threshold: 0.9
