citation_validation:
  enabled: true
  min_citation_score: 0.65
  alpha: 0.7
  beta: 0.3
  citation_match_threshold: 0.8

llm_validation:
  enabled: true
  model: "glm-4.7"           # model_registry.yaml 中的 key（逻辑名）
  temperature: 0.0                # 调用参数（不在 registry 中）
  max_tokens: 800
  min_overall_score: 0.75
  max_concurrency: 2
  max_retries: 2
  prompt_path: "benchforge/prompts/verify_agent/quality_prompt.md"

selection:
  enabled: true
  embedding_model: "all-MiniLM-L6-v2"
