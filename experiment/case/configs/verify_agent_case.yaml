citation_validation:
  enabled: true
  min_chunk_citation_score: 0.85
  min_answer_citation_score: 0.4
  alpha: 0.5
  beta: 0.5
  citation_match_threshold: 0.6

llm_validation:
  enabled: true
  model: "glm-4.7"
  temperature: 0.0
  max_tokens: 1024
  min_overall_score: 0.75
  max_concurrency: 2
  max_retries: 2
  prompt_path: "benchforge/prompts/verify_agent/quality_prompt.md"

selection:
  mode: "light"
  embedding_model: "all-MiniLM-L6-v2"
  semantic_similarity_threshold: 0.9
