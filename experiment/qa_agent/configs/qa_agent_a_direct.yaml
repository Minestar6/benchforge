# qa_agent 配置 — A 组：Direct Generation
# 不走 qa_agent 主循环，config 仅用于 direct_generation.py 读取 retrieval/chunking 等基础配置

# ── 模型（引用 model_registry.yaml 中的逻辑名） ────────────────────────────────
model:
  name: "deepseek-v3"
  temperature: 0.2
  max_tokens: 4096
  max_retries: 3

# ── Wikipedia 检索 ────────────────────────────────────────────────────────────
retrieval:
  request_timeout: 10
  saliency_rerank: true
  saliency_top_k: 5
  saliency_start_date: "2022010100"
  saliency_end_date: "2025010100"
  min_paragraph_tokens: 20

# ── 分块（题目生成用） ─────────────────────────────────────────────────────────
chunking:
  chunk_size: 1024
  overlap: 50
  encoding: "cl100k_base"

# ── 分块（文档总结用） ─────────────────────────────────────────────────────────
summarization_chunking:
  chunk_size: 4096
  overlap: 125
  encoding: "cl100k_base"

# ── Multi-Chunk 组合生成 ─────────────────────────────────────────────────────
multi_chunk:
  h_min: 2
  h_max: 4
  multi_ratio: 1.0
  max_units_per_topic: 300
  max_units_per_expansion: 300

# ── 候选池 ────────────────────────────────────────────────────────────────────
candidate_pool:
  min_candidate_multiplier: 1.5
  max_candidate_multiplier: 2.0

# ── 初始广度轮 ────────────────────────────────────────────────────────────────
initial_breadth:
  enabled: true
  max_topics_per_round: 4
  difficulty: "medium"

# ── 自适应补题规划 ────────────────────────────────────────────────────────────
planner:
  topics_per_round: 3

# ── Chunk 混合比例（按难度） ───────────────────────────────────────────────────
chunk_mix:
  by_difficulty:
    easy:
      single_ratio: 0.7
      multi_ratio: 0.3
    medium:
      single_ratio: 0.5
      multi_ratio: 0.5
    hard:
      single_ratio: 0.1
      multi_ratio: 0.9
  mode_adjustment:
    qa:
      single_delta: 0.1
    multiple_choice:
      single_delta: -0.1

# ── 每 chunk 平均生成题目数 ───────────────────────────────────────────────────
generation_yield:
  qa:
    single_chunk_avg_questions: 2.0
    multi_chunk_avg_questions: 3.0
  multiple_choice:
    single_chunk_avg_questions: 1.5
    multi_chunk_avg_questions: 2.0

# ── single_k / multi_k 上下界 ─────────────────────────────────────────────────
chunk_limits:
  qa:
    single_k:
      min: 1
      max: 4
    multi_k:
      min: 0
      max: 3
  multiple_choice:
    single_k:
      min: 0
      max: 3
    multi_k:
      min: 1
      max: 4

# ── 运行时安全阈值 ────────────────────────────────────────────────────────────
runtime:
  max_consecutive_empty_rounds_per_mode: 3
  max_failures_per_mode: 3
  max_used_chunk_combinations: 10000
  llm_timeout_seconds: 60
  retrieval_timeout_seconds: 30

# ── 日志 ──────────────────────────────────────────────────────────────────────
logging:
  level: "INFO"

# ── 实验控制 — A 组：Direct Generation（不使用 qa_agent 主循环） ─────────────
experiment:
  name: direct_generation
  enable_feedback: false
  enable_hard_generate: false
  enable_difficulty_adaptation: false
  fixed_strategy: null
  fixed_difficulty: null
  disable_initial_breadth: true

# ── Direct Generation 专用配置 ─────────────────────────────────────────────────
direct_generation:
  max_chunks_per_topic: 4
