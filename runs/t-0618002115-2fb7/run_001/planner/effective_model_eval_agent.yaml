dataset_evaluation:
  enabled: true
  metrics:
  - name: citation_score
  - name: diversity_score
judge:
  enabled: true
  prompt_system: benchforge/prompts/model_eval_agent/judge_system_prompt.md
  prompt_user: benchforge/prompts/model_eval_agent/judge_user_prompt.md
metrics:
  multiple_choice:
    automatic_metrics:
    - name: accuracy
    - name: invalid_rate
    - name: accuracy
    llm_judge_metrics: []
  qa:
    automatic_metrics:
    - name: semantic_accuracy
    - name: exact_match
    - name: f1
    - name: precision
    - name: recall
    - name: rouge_l
    - name: bleu
    - name: bertscore
    - name: semantic_similarity
    - name: exact_match
    - name: semantic_accuracy
    llm_judge_metrics:
    - description: The degree to which the response directly addresses the question
        and remains focused on the requested topic.
      name: answer_relevance
    - description: The extent to which the response is supported by the provided evidence
        and avoids unsupported claims.
      name: faithfulness
    - description: The correctness and reliability of the factual information contained
        in the response.
      name: factual_accuracy
    - description: The consistency, clarity, and soundness of the reasoning presented
        in the response.
      name: logical_coherence
    - description: The extent to which the response covers all important information
        required to fully answer the question.
      name: completeness
    - description: Judge whether the answer is factually correct.
      name: correctness
models:
  candidate_model_names:
  - deepseek-v3.2
  - deepseek-v3.2
  generation_defaults:
    max_tokens: 1024
    temperature: 0.0
    top_p: 1.0
  judge_defaults:
    max_tokens: 512
    temperature: 0.0
    top_p: 1.0
  judge_model_name: deepseek-v3.2
