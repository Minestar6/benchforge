citation_validation:
  alpha: 0.3
  beta: 0.7
  citation_match_threshold: 0.6
  enabled: true
  min_answer_citation_score: 0.55
  min_chunk_citation_score: 0.6
  min_citation_score: 0.55
llm_validation:
  enabled: true
  max_concurrency: 2
  max_retries: 2
  max_tokens: 1500
  min_overall_score: 0.7
  model: deepseek-v4
  prompt_path: benchforge/prompts/verify_agent/quality_prompt.md
  temperature: 0.0
selection:
  embedding_model: all-MiniLM-L6-v2
  mode: light
  semantic_similarity_threshold: 0.9
